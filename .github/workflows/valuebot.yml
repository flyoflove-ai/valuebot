name: valuebot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"      # 6시간마다 재기동 (러너 만료 대비)

concurrency:
  group: valuebot-resident
  cancel-in-progress: true      # 좀비 런 방지

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # Actions 레벨 상한

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run resident loop
        env:
          VALUEBOT_TG_TOKEN:   ${{ secrets.VALUEBOT_TG_TOKEN }}
          VALUEBOT_GEMINI_KEY: ${{ secrets.VALUEBOT_GEMINI_KEY }}
          VALUEBOT_ALLOWED:    ${{ secrets.VALUEBOT_ALLOWED }}
          VALUEBOT_MAX_RUNTIME: "19800"
          PYTHONUNBUFFERED: "1"
        run: |
          # OS 레벨 타임아웃 래퍼 (파이썬이 매달려도 강제 종료)
          timeout --signal=SIGTERM --kill-after=60s 20400s python valuebot.py || code=$?
          echo "exit: ${code:-0}"
          if [ "${code:-0}" = "124" ] || [ "${code:-0}" = "137" ]; then
            echo "timeout reached — normal exit"
            exit 0
          fi
          exit ${code:-0}
